apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "autopilot.fullname" . }}-node-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "autopilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      {{- include "autopilot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node-agent
  template:
    metadata:
      labels:
        {{- include "autopilot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node-agent
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "autopilot.fullname" .) }}
      containers:
        - name: node-agent
          image: "{{ .Values.nodeAgent.image.repository }}:{{ .Values.nodeAgent.image.tag }}"
          imagePullPolicy: {{ .Values.nodeAgent.image.pullPolicy }}
          resources:
            {{- toYaml .Values.nodeAgent.resources | nindent 12 }}
