# values-airgapped.yaml
# Air-gapped / restricted-environment overrides for Inference Fabric Autopilot.
#
# Usage:
#   helm install autopilot ./autopilot-0.1.0.tgz \
#     --namespace inference \
#     --values values.yaml \
#     --values values-airgapped.yaml
#
# This file overrides only the fields that differ from values.yaml for
# air-gapped operation. All other values inherit from values.yaml.

# --- Image registry ---
# Set this to your internal registry hostname, e.g. registry.internal.example.com
# Leave empty if images are loaded directly onto nodes (imagePullPolicy: Never).
image:
  registry: ""

controlPlane:
  image:
    # Point to your internal registry path if image.registry is set:
    #   repository: ifa/control-plane
    # Or leave as-is if images are loaded directly on nodes.
    repository: ifa-control-plane
    tag: dev
    # Use Never if images are pre-loaded on nodes (no registry).
    # Use IfNotPresent if images are pushed to an internal registry.
    pullPolicy: Never

nodeAgent:
  image:
    repository: ifa-node-agent
    tag: dev
    pullPolicy: Never

# --- Deployment mode ---
# Signals air-gapped posture at the config layer.
# Validated at startup — will reject egress.enabled: true when set to airgapped.
config:
  deployment_mode: airgapped

  # --- Egress ---
  # Disabled in air-gapped mode. Enforced by NetworkPolicy below.
  # Must be false when deployment_mode is airgapped.
  egress:
    enabled: false

  # --- Privacy ---
  # All fields are false by default and must remain false.
  # Declared explicitly here so security reviewers can verify posture at a glance.
  privacy:
    collect_prompt_bodies: false
    collect_response_bodies: false
    collect_headers: false
    collect_user_identifiers: false

  # --- RBAC ---
  # Only valid value is read-only. Validated at startup.
  rbac:
    mode: read-only

  # --- Prometheus ---
  # In air-gapped mode, set this to your in-cluster Prometheus URL.
  # This is used when collector.mode is prometheus.
  prometheus:
    url: "http://prometheus.monitoring.svc.cluster.local:9090"

  collector:
    mode: prometheus
    interval_seconds: 15
    # Add your workload scrape targets here.
    # Example:
    # prometheus_targets:
    #   - workload_name: vllm-llama3
    #     namespace: inference
    #     runtime: vllm
    #     model_name: llama-3-8b
    #     metrics_url: http://vllm-llama3.inference.svc.cluster.local:8000/metrics

  kubernetes:
    enabled: true
    namespace: inference
    sync_interval_seconds: 30

  database:
    # Set to true only if TimescaleDB is deployed in-cluster.
    enabled: false
    dsn: "postgres://postgres:autopilot@timescaledb.inference.svc.cluster.local:5432/autopilot?sslmode=disable"

  logging:
    level: info
    format: json

# --- NetworkPolicy ---
# Deploys a default-deny-egress NetworkPolicy on the inference namespace.
# Requires a CNI that supports NetworkPolicy (Calico, Cilium, Antrea).
# Set to false only if your CNI does not support NetworkPolicy and you are
# enforcing egress restriction at a different layer.
networkPolicy:
  enabled: true

  # Allow egress to Prometheus in this namespace/label.
  # Adjust to match your Prometheus deployment.
  prometheusNamespace: monitoring

  # Allow egress to TimescaleDB in this namespace.
  # Only relevant if database.enabled is true.
  timescaledbNamespace: inference

# --- ServiceAccount ---
serviceAccount:
  create: true
  name: ""