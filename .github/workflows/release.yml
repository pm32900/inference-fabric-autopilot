name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # Cross-compiled by hand rather than with a release framework: two
      # binaries and four platforms do not need one, and a tool that is not
      # used often enough to keep working is worse than a loop.
      - name: Build
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            for cmd in control-plane ifa; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
                -trimpath -ldflags "-s -w -X main.version=${version}" \
                -o "dist/${cmd}" "./cmd/${cmd}"
            done
            tar -czf "dist/ifa_${version}_${os}_${arch}.tar.gz" -C dist control-plane ifa
            rm dist/control-plane dist/ifa
          done
          ( cd dist && sha256sum ./*.tar.gz > SHA256SUMS )

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
