name: Verify

# The gate the audit migration merges against.
#
# Kept deliberately separate from ci.yml, and deliberately narrow. Change-set 05
# rewrites ci.yml, which would swap the required check's job name out from under
# branch protection mid-migration and wedge every later run. Nothing in the
# migration queue touches this file, so the gate stays stable for the whole
# migration and this workflow can be retired afterwards.
#
# Every check here has been confirmed to pass at each intermediate state of the
# queue, so a failure means the change-set genuinely broke something rather than
# that the gate was aspirational.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # go-version-file rather than a literal: main and the migration branches
      # declare different toolchains, and pinning a version here would fail on
      # one side of every change-set that moves it.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # No gofmt gate here on purpose. Three files on main are not gofmt -s
      # clean, and all three are deleted or rewritten by change-set 03 — so
      # formatting them in advance would conflict with the very change-set that
      # fixes them, and requiring the check before then would block change-sets
      # 02 and 03 from merging at all. Formatting is still checked inside each
      # migration run, and ci.yml from change-set 05 gates it properly once the
      # tree is clean.

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The collector scrapes concurrently and the telemetry store is read by
      # HTTP handlers while it is written, so the race detector is doing real
      # work here rather than ticking a box.
      - name: Test
        run: go test -race -count=1 ./...
